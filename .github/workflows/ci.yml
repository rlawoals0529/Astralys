name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - name: Capture frontend preview screenshots
        run: |
          npm run preview > /tmp/astralys-design-preview.log 2>&1 &
          node scripts/capture-preview.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: frontend-design-preview
          path: artifacts/design-preview/
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  photo-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.99.0 test --locked --manifest-path spikes/photocraft/Cargo.toml
      - run: cargo +1.99.0 build --locked --manifest-path spikes/photocraft/Cargo.toml --target wasm32-unknown-unknown --release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: node --check spikes/photocraft/composite.worker.js
      - run: node spikes/photocraft/verify.mjs
      - run: npx playwright install --with-deps chromium firefox
      - run: npx playwright test -c playwright.spike.config.ts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: photo-spike-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file spikes/photocraft/Cargo.lock --deny warnings

  memory-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - name: Exercise local browser memory workloads
        run: |
          npm run preview > /tmp/astralys-preview.log 2>&1 &
          ASTRALYS_MEMORY_RUNS=1 node scripts/measure-browser-memory.mjs > /tmp/astralys-memory.json
          cat /tmp/astralys-memory.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: memory-harness-evidence
          path: |
            /tmp/astralys-memory.json
            /tmp/astralys-preview.log
          retention-days: 7
