name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  photo-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.99.0 test --locked --manifest-path spikes/photocraft/Cargo.toml
      - run: cargo +1.99.0 build --locked --manifest-path spikes/photocraft/Cargo.toml --target wasm32-unknown-unknown --release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: node --check spikes/photocraft/composite.worker.js
      - run: node spikes/photocraft/verify.mjs
      - run: npx playwright install --with-deps chromium firefox
      - run: npx playwright test -c playwright.spike.config.ts
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file spikes/photocraft/Cargo.lock --deny warnings
